<!doctype html><html lang="pl"><meta charset="utf-8"><title>Misja AED · pokaz prototypu</title>
<style>*{margin:0}body{background:#f5f6fa}canvas{display:block;width:100vw}</style>
<canvas width="1920" height="1080" id="canvas"></canvas>
<script>
const shots=@@SHOTS@@, cues=@@WORDS@@, mic=@@MIC@@, sources=@@CLIPS@@, art=@@IMAGES@@, route=@@ROUTE@@;
const canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d',{alpha:false});
const v={}, im={}, W=1920,H=1080,C={bg:'#f5f6fa',ink:'#142238',sub:'#506170',red:'#d62a46',blue:'#135a9e',line:'#cbd3da'};
const clamp=(n,a=0,b=1)=>Math.min(b,Math.max(a,n));
const smooth=n=>{const k=clamp(n);return k*k*(3-2*k)};
const lerp=(a,b,n)=>a+(b-a)*clamp(n);
function rect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function text(s,x,y,size,color=C.ink,weight=600,align='left'){
 ctx.fillStyle=color;ctx.font=weight+' '+size+'px -apple-system, Arial, sans-serif';
 ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function line(x,y,X,Y,width,color){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke();}
function dot(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function ring(x,y,r,width,c){ctx.strokeStyle=c;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}
function wordCaption(t,center=false){
 const cue=cues.find(e=>t>=e.a&&t<e.b);if(!cue)return;
 const hot=cue.words.findLastIndex(o=>o.t<=t);
 let size=center?98:48, gap=center?25:14;
 ctx.font='700 '+size+'px Arial,sans-serif';
 let widths=cue.words.map(o=>ctx.measureText(o.w).width), total=widths.reduce((a,b)=>a+b,0)+(widths.length-1)*gap;
 if(total>1770){const f=1770/total;size*=f;gap*=f;widths=widths.map(i=>i*f);total=1770;}
 let x=(W-total)/2, y=center?520:1008;
 cue.words.forEach((o,i)=>{
   if(i===hot){rect(x-6,y-size*.59,widths[i]+12,size*1.20,5,C.red);}
   ctx.font='700 '+size+'px Arial,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle=i===hot?'white':C.ink;ctx.fillText(o.w,x,y+1);
   x+=widths[i]+gap;
 });
}
const merc=n=>Math.asinh(Math.tan(n*Math.PI/180))*180/Math.PI;
const mapScale=1900/.0165, p=([lon,lat])=>[(lon-21.0055)*mapScale,(merc(52.236)-merc(lat))*mapScale];
const raw=route.map(p), X0=Math.min(...raw.map(v=>v[0]))-19, Y0=Math.min(...raw.map(v=>v[1]))-21;
const norm = raw.map(v=>[(v[0]-X0)*2.04+160,(v[1]-Y0)*2.04+139]);
function trace(points,f,col,width){
 const lens=points.slice(1).map((pt,i)=>Math.hypot(pt[0]-points[i][0],pt[1]-points[i][1]));
 let distance=f*lens.reduce((a,b)=>a+b,0);ctx.beginPath();ctx.moveTo(...points[0]);ctx.lineJoin='round';ctx.lineCap='round';
 for(let i=0;i<lens.length;i++){const v=points[i+1],u=points[i],k=clamp(distance/(lens[i]||1));ctx.lineTo(lerp(u[0],v[0],k),lerp(u[1],v[1],k));distance-=lens[i];if(distance<=0)break;}
 ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();
}
function opener(t){
 const bx=84,by=85,bw=1040,bh=743;
 ctx.save();ctx.beginPath();ctx.roundRect(bx,by,bw,bh,12);ctx.clip();
 // The projection, roads and polyline use the same OSM geometry as the actual demo.
 const ox=160-X0*2.04, oy=139-Y0*2.04;
 ctx.drawImage(im.map,ox,oy,1900*2.04,1598.1*2.04);
 ctx.fillStyle='#ffffff70';ctx.fillRect(bx,by,bw,bh);
 const origin=norm[0],end=norm.at(-1);ctx.setLineDash([11,13]);trace([origin,end],smooth(t/.75),'#7f8d9c',5);ctx.setLineDash([]);
 trace(norm,smooth((t-.95)/1.65),'white',19);trace(norm,smooth((t-.95)/1.65),C.blue,10);
 dot(...origin,21,'white');dot(...origin,15,C.blue);
 const pulse=(t%1.25)/1.25;ctx.save();ctx.globalAlpha=(1-pulse)*.64;ring(...end,20+27*pulse,4,C.red);ctx.restore();dot(...end,21,'white');dot(...end,14,C.red);
 rect(origin[0]-100,origin[1]+29,198,49,4,'#fff');text('ul. Widok',origin[0],origin[1]+54,28,C.ink,660,'center');
 rect(end[0]-94,end[1]-62,188,45,4,'white');text('AED',end[0],end[1]-39,30,C.red,720,'center');ctx.restore();
 text('WARSZAWA  /  CHMIELNA 21',1190,165,25,C.sub,650);
 text('111 m',1180,287,110,C.ink,710);text('w linii prostej',1190,374,40,C.sub,490);
 line(1190,452,1730,452,2,C.line);ctx.save();ctx.globalAlpha=smooth((t-.78)/.5);
 text('291 m',1180,564,110,C.red,710);text('drogą pieszą',1190,653,40,C.sub,490);ctx.restore();
 text('© OpenStreetMap  /  trasa piesza FOSSGIS',93,865,21,C.sub,450);
 wordCaption(t);
}
function close(t){
 const phase=smooth((t-56.2)/1.1);
 const total=Math.round(lerp(18265,18272,phase));
 text('MISJA AED',138,179,35,C.red,720);
 text(total.toLocaleString('pl-PL'),123,420,178,C.ink,720);
 text('lokalizacje defibrylatorów',140,562,66,C.ink,600);
 rect(139,657,Math.max(2,410*phase),6,1,C.red);
 text('Azeno Hi   /   HackNation 2026',140,779,34,C.sub,550);
 ctx.drawImage(im.qr,1300,183,365,365);text('Otwórz działające demo',1484,606,34,C.ink,650,'center');
 text('pawelkonior.github.io/misja-aed',1484,664,28,C.sub,500,'center');
 wordCaption(t);
}
function setTime(video,t){
 const wanted=clamp(t,0,video.duration-.035);
 if(Math.abs(video.currentTime-wanted)<.001&&video.readyState>=2)return Promise.resolve();
 return new Promise((resolve,reject)=>{
  const finish=()=>{video.removeEventListener('error',fail);resolve()};
  const fail=()=>{video.removeEventListener('seeked',finish);reject(Error('Video decoding failed'))};
  video.addEventListener('seeked',finish,{once:true});video.addEventListener('error',fail,{once:true});video.currentTime=wanted;
 });
}
async function seek(time){
 const t=clamp(time,0,59.999);const [key,a,b]=shots.find(s=>t>=s[1]&&t<s[2]);
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
 if(key==='open'){opener(t);return}
 if(key==='close'){close(t);return}
 if(key==='turn'){
   const split=smooth((t-a)/.22);
   line(960-85*split,392,960+85*split,392,5,C.red);
   wordCaption(t,true);return;
 }
 const vid=v[key];
 let sourceTime=(t-a)/(b-a)*vid.duration;
 if(key==='voice'){
   const guide=[[42.6,0],[45.05,mic.clickRead],[46.59,mic.clickMute],[47.15,mic.clickMic],[49.05,mic.speechOnset],[49.83,mic.stepFour],[51.8,vid.duration]];
   const slot=guide.findIndex((p,i)=>i>0&&t<=p[0]);
   const lo=guide[slot-1],hi=guide[slot];
   sourceTime=lerp(lo[1],hi[1],(t-lo[0])/(hi[0]-lo[0]));
 }
 await setTime(vid,sourceTime);
 const x=126,y=16,w=1668,h=w*9/16;
 ctx.save();ctx.shadowBlur=14;ctx.shadowColor='#1e314c25';ctx.shadowOffsetY=3;rect(x,y,w,h,8,'#fff');ctx.restore();
 ctx.save();ctx.beginPath();ctx.roundRect(x,y,w,h,8);ctx.clip();ctx.drawImage(vid,x,y,w,h);ctx.restore();
 rect(x+2,y,w-4,5,2,C.red);
 if(key==='ar'||key==='arrival'){
   // This mark is retained even when the recording zooms beyond the in-app mode label.
   rect(x+w-303,y+13,285,41,4,'#132c2af2');text('SYMULACJA MARSZU',x+w-159,y+34,21,'#fff',700,'center');
 }
 wordCaption(t);
}
Promise.all([
 ...Object.entries(art).map(([k,src])=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{im[k]=i;res()};i.onerror=rej;i.src=src})),
 ...Object.entries(sources).map(([k,src])=>new Promise((res,rej)=>{const e=document.createElement('video');e.muted=true;e.playsInline=true;e.preload='auto';e.onloadeddata=()=>{v[k]=e;res()};e.onerror=rej;e.src=src;e.load()}))
]).then(async()=>{await seek(0);window.__anim={duration:60,width:W,height:H,canvas,seek,ready:true,shots};});
</script></html>

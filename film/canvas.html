<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Misja AED · pokaz aplikacji</title>
    <style>
      * {
        margin: 0;
      }
      body {
        background: #122d35;
      }
      canvas {
        display: block;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <canvas id="film" width="1920" height="1080"></canvas>
    <script>
      const timeline = @@TIMELINE@@;
      const sources = @@CLIPS@@;
      const captures = @@CAPTURES@@;
      const canvas = document.getElementById("film");
      const ctx = canvas.getContext("2d", { alpha: false });
      const width = canvas.width,
        height = canvas.height;
      const chapters = timeline.chapters;
      const videos = new Map();
      const dark = "#122c34",
        cream = "#f6f7f3",
        ink = "#152e37",
        muted = "#4a6769";
      const phoneHeight = 1004;
      const phone = {
        width: (phoneHeight * 410) / 864,
        height: phoneHeight,
        x: 1196 - (phoneHeight * 410) / 864 / 2,
        y: (height - phoneHeight) / 2,
      };
      const qr = new Image();
      const limit = (v, low, high) => Math.max(low, Math.min(v, high));
      function smooth(t) {
        const p = limit(t, 0, 1);
        return p * p * (3 - 2 * p);
      }
      function text(str, x, y, size, color, weight = 500, family = "Arial") {
        ctx.font = weight + " " + size + "px " + family + ", sans-serif";
        ctx.fillStyle = color;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(str, x, y);
      }
      function writeLines(lines, x, y, gap, size, color) {
        lines.forEach((str, index) =>
          text(str, x, y + index * gap, size, color, 700, "PitchBold"),
        );
      }
      function rule(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      }
      function card(chapter, index) {
        ctx.fillStyle = dark;
        ctx.fillRect(0, 0, width, height);
        rule(188, 144, 68, 7, "#ff846d");
        text("Misja AED", 188, 207, 37, "#f5f5ed", 700, "PitchBold");
        text("mObywatel", 188, 259, 31, "#c2d2cf");
        const titleY = chapter.title.length === 1 ? 486 : 436;
        writeLines(chapter.title, 181, titleY, 113, 100, "#f6f7f3");
        text(
          chapter.detail,
          188,
          titleY + (chapter.title.length - 1) * 113 + 129,
          41,
          "#d4e2df",
        );
        progress(index, true);
      }
      function progress(index, onCard) {
        const x = 190,
          y = 923,
          w = 52,
          gap = 12;
        for (let i = 0; i < chapters.length; i++)
          rule(
            x + i * (w + gap),
            y,
            w,
            5,
            i === index
              ? onCard
                ? "#ff846d"
                : "#c74446"
              : onCard
                ? "#426068"
                : "#cbd5d0",
          );
      }
      function drawRings(capture, localTime) {
        const scale = phone.height / 864;
        for (const tap of capture.taps) {
          const dt = localTime - tap.t;
          if (dt < -0.58 || dt > 0.18) continue;
          const press = smooth((dt + 0.58) / 0.4),
            release = smooth(dt / 0.18);
          const radius = (9 + 9 * press + 5 * release) * scale;
          const x = phone.x + tap.x * scale,
            y = phone.y + tap.y * scale;
          ctx.save();
          ctx.globalAlpha = 0.94 * press * (1 - release);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, 2 * Math.PI);
          ctx.fillStyle = "#f57a2928";
          ctx.fill();
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 3.3 * scale;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(x, y, radius + 2.2 * scale, 0, 2 * Math.PI);
          ctx.strokeStyle = "#ce5d20";
          ctx.lineWidth = 2 * scale;
          ctx.stroke();
          ctx.restore();
        }
      }
      function application(chapter, index, localTime) {
        ctx.fillStyle = cream;
        ctx.fillRect(0, 0, width, height);
        rule(188, 331, 61, 6, "#c74446");
        text("Misja AED", 188, 389, 30, muted, 600);
        writeLines(chapter.label, 184, 486, 80, 64, ink);
        if (chapter.id === "guide") {
          ctx.fillStyle = "white";
          ctx.fillRect(188, 603, 164, 164);
          ctx.drawImage(qr, 197, 612, 146, 146);
          text("Otwórz aplikację", 188, 801, 27, muted);
        }
        progress(index, false);
        ctx.save();
        ctx.shadowColor = "#1a332e45";
        ctx.shadowBlur = 31;
        ctx.shadowOffsetY = 10;
        ctx.beginPath();
        ctx.roundRect(
          phone.x + 2,
          phone.y + 1,
          phone.width - 4,
          phone.height - 2,
          phone.width * 0.14,
        );
        ctx.fillStyle = "#606665";
        ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(
          phone.x,
          phone.y,
          phone.width,
          phone.height,
          phone.width * 0.14,
        );
        ctx.clip();
        // Draw the entire frame. The stage position, source rectangle and scale never change.
        ctx.drawImage(
          videos.get(chapter.id),
          phone.x,
          phone.y,
          phone.width,
          phone.height,
        );
        drawRings(captures[chapter.id], localTime);
        ctx.restore();
      }
      async function seekVideo(video, time) {
        const target = limit(time, 0, Math.max(0, video.duration - 1 / 30));
        if (
          Math.abs(target - video.currentTime) < 0.0008 &&
          video.readyState >= 2
        )
          return;
        await new Promise((resolve, reject) => {
          const done = () => {
            video.removeEventListener("error", error);
            resolve();
          };
          const error = () => {
            video.removeEventListener("seeked", done);
            reject(Error("Cannot decode app capture"));
          };
          video.addEventListener("seeked", done, { once: true });
          video.addEventListener("error", error, { once: true });
          video.currentTime = target;
        });
      }
      async function seek(time) {
        const t = limit(time, 0, timeline.duration - 0.001);
        const index = chapters.findIndex((ch) => t >= ch.start && t < ch.end);
        const chapter = chapters[index],
          local = t - chapter.start;
        if (local < timeline.cardDuration) {
          card(chapter, index);
          return;
        }
        const playback = local - timeline.cardDuration;
        await seekVideo(videos.get(chapter.id), playback);
        application(chapter, index, playback);
        if (playback < 0.24) {
          ctx.save();
          ctx.globalAlpha = 1 - smooth(playback / 0.24);
          card(chapter, index);
          ctx.restore();
        }
      }
      const ready = [
        new FontFace("PitchBold", "url(" + @@TITLEFONT@@ + ")", {
          weight: "700",
        })
          .load()
          .then((f) => document.fonts.add(f)),
        new Promise((resolve, reject) => {
          qr.onload = resolve;
          qr.onerror = reject;
          qr.src = @@QR@@;
        }),
      ];
      for (const [id, url] of Object.entries(sources)) {
        ready.push(
          new Promise((resolve, reject) => {
            const video = document.createElement("video");
            video.onloadeddata = () => {
              videos.set(id, video);
              resolve();
            };
            video.onerror = reject;
            video.muted = true;
            video.playsInline = true;
            video.preload = "auto";
            video.src = url;
            video.load();
          }),
        );
      }
      Promise.all(ready).then(async () => {
        await seek(0);
        window.__anim = {
          canvas,
          width,
          height,
          duration: timeline.duration,
          ready: true,
          seek,
          shots: chapters,
        };
      });
    </script>
  </body>
</html>

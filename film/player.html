<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142238" />
    <title>Misja AED · film demonstracyjny</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #142238;
        background: #f5f6fa;
      }
      main {
        --gutter: clamp(12px, 2vw, 28px);
        max-width: 1600px;
        padding: clamp(10px, 1.6vh, 18px) var(--gutter);
        margin: auto;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        flex-wrap: wrap;
      }
      header {
        margin-bottom: 10px;
      }
      .film-heading {
        display: flex;
        align-items: baseline;
        gap: 4px 14px;
        flex-wrap: wrap;
      }
      small {
        color: #4b5a6b;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        letter-spacing: -0.04em;
        font-size: clamp(26px, 3.3vw, 40px);
        line-height: 1.1;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        background: #142238;
      }
      a {
        color: #185993;
        text-underline-offset: 4px;
      }
      footer {
        margin-top: 10px;
      }
      @media (min-width: 760px) {
        main {
          max-width: min(1600px, calc((100svh - 120px) * 16 / 9 + 2 * var(--gutter)));
        }
      }
      @media (max-width: 759px) {
        main {
          padding-inline: 0;
        }
        header,
        footer {
          padding-inline: var(--gutter);
        }
      }
      :focus-visible {
        outline: 3px solid #256fc7;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="film-heading">
          <h1>Misja AED</h1>
          <small>Azeno Hi · 60 s bez dźwięku</small>
        </div>
        <a href="../">Otwórz aplikację</a>
      </header>
      <video
        controls
        playsinline
        preload="metadata"
        poster="../materialy/plakat.jpg"
        aria-label="Misja AED. Pokaz aplikacji z planszami po polsku, 60 sekund bez dźwięku"
      >
        <source src="../materialy/Misja-AED-60s.mp4" type="video/mp4" />
        <a href="../materialy/Misja-AED-60s.mp4">Pobierz film MP4</a>
      </video>
      <footer>
        <a href="../materialy/Misja-AED.pdf">Prezentacja Azeno Hi (PDF)</a>
        <a href="https://github.com/pawelkonior/misja-aed/blob/main/docs/media.md">Autorzy nagrań i zdjęć</a>
        <a href="https://github.com/pawelkonior/misja-aed">Kod i dane projektu</a>
      </footer>
    </main>
  </body>
</html>
